name: Publish to Comfy registry
on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check project version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']

          before = os.environ['BEFORE_SHA']
          previous_version = None
          if before != '0' * 40:
              previous_path = subprocess.check_output(
                  ['git', 'ls-tree', '--name-only', before, '--', 'pyproject.toml'],
                  text=True,
              ).strip()
              if previous_path:
                  previous_text = subprocess.check_output(
                      ['git', 'show', f'{before}:pyproject.toml'],
                      encoding='utf-8',
                  )
                  previous_version = tomllib.loads(previous_text).get('project', {}).get('version')

          changed = version != previous_version
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'changed={str(changed).lower()}\n')
          print(f'Version: {previous_version} -> {version}')
          PY

      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
